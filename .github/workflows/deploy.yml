name: Deploy to production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="${missing} SSH_HOST"
          [ -z "$SSH_USER" ] && missing="${missing} SSH_USER"
          [ -z "$SSH_PASSWORD" ] && missing="${missing} SSH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repository secrets:${missing}"
            echo "Add them at: Settings → Secrets and variables → Actions → New repository secret"
            echo "  SSH_HOST = 187.127.87.232"
            echo "  SSH_USER = root"
            echo "  SSH_PASSWORD = your server SSH password"
            exit 1
          fi

      - name: Install rsync and sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH_HOST="$(echo -n "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(echo -n "$SSH_USER" | tr -d '[:space:]')"
          export SSHPASS="$(echo -n "$SSH_PASSWORD" | tr -d '\r')"
          echo "Connecting to ${SSH_USER}@${SSH_HOST} ..."
          for attempt in 1 2; do
            echo "SSH attempt ${attempt}/2 ..."
            if sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
              "${SSH_USER}@${SSH_HOST}" "echo SSH connection OK"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::SSH failed — GitHub cannot reach port 22 on your server."
          echo "Deploy from your Mac instead: SSH_PASSWORD='...' ./scripts/deploy-from-mac.sh"
          echo "Or enable auto-deploy: SSH_PASSWORD='...' ./scripts/setup-pull-deploy.sh"
          exit 1

      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH_HOST="$(echo -n "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(echo -n "$SSH_USER" | tr -d '[:space:]')"
          export SSHPASS="$(echo -n "$SSH_PASSWORD" | tr -d '\r')"
          for attempt in 1 2 3; do
            echo "Rsync attempt ${attempt}/3 ..."
            if rsync -avz --delete \
              --exclude '.git' \
              --exclude '.env' \
              --exclude 'config/odoo.conf' \
              -e "sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
              ./ "${SSH_USER}@${SSH_HOST}:/opt/torque-zone/"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Run deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH_HOST="$(echo -n "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(echo -n "$SSH_USER" | tr -d '[:space:]')"
          export SSHPASS="$(echo -n "$SSH_PASSWORD" | tr -d '\r')"
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3 ..."
            if sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "cd /opt/torque-zone && chmod +x scripts/deploy.sh && ./scripts/deploy.sh"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
